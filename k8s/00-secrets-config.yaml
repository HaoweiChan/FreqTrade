apiVersion: v1
kind: Secret
metadata:
  name: freqtrade-secrets
type: Opaque
stringData:
  # Base64 encoding will be handled by k8s apply if using stringData
  # Replace these with actual values from your .env before applying
  telegram-token: "REPLACE_WITH_TELEGRAM_TOKEN"
  telegram-chat-id: "REPLACE_WITH_TELEGRAM_CHAT_ID"
  binance-key: "REPLACE_WITH_BINANCE_KEY"
  binance-secret: "REPLACE_WITH_BINANCE_SECRET"
  ft-ui-username: "REPLACE_WITH_FT_UI_USERNAME"
  ft-ui-password: "REPLACE_WITH_FT_UI_PASSWORD"
  github-token: "REPLACE_WITH_GITHUB_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freqtrade-config
data:
  # This config.json will be mounted to /freqtrade/user_data/config.json
  # You should paste your actual config.json content here
  config.json: |
    {
      "max_open_trades": 3,
      "stake_currency": "USDT",
      "stake_amount": "unlimited",
      "tradable_balance_ratio": 0.99,
      "fiat_display_currency": "USD",
      "dry_run": true,
      "dry_run_wallet": 1000,
      "cancel_open_orders_on_exit": false,
      "unfilledtimeout": {
        "entry": 10,
        "exit": 10
      },
      "exchange": {
        "name": "binance",
        "key": "",
        "secret": "",
        "ccxt_config": {
          "enableRateLimit": true
        },
        "ccxt_async_config": {
          "enableRateLimit": true,
          "rateLimit": 200
        },
        "pair_whitelist": [
          "BTC/USDT",
          "ETH/USDT"
        ],
        "pair_blacklist": [
          "BNB/.*"
        ]
      },
      "entry_pricing": {
        "price_side": "same",
        "use_order_book": true,
        "order_book_top": 1,
        "price_last_balance": 0.0,
        "check_depth_of_market": {
          "enabled": false,
          "bids_to_ask_delta": 1
        }
      },
      "exit_pricing": {
        "price_side": "same",
        "use_order_book": true,
        "order_book_top": 1
      },
      "telegram": {
        "enabled": true,
        "token": "",
        "chat_id": ""
      },
      "api_server": {
        "enabled": true,
        "listen_ip_address": "0.0.0.0",
        "listen_port": 8080,
        "verbosity": "error",
        "enable_openapi": false,
        "jwt_secret_key": "supersecret",
        "CORS_origins": [],
        "username": "",
        "password": ""
      },
      "bot_name": "freqtrade",
      "initial_state": "running",
      "force_entry_enable": false,
      "internals": {
        "process_throttle_secs": 5
      }
    }
