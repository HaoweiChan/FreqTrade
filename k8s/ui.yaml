apiVersion: apps/v1
kind: Deployment
metadata:
  name: freqtrade-ui
  labels:
    app: freqtrade
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freqtrade
      component: ui
  template:
    metadata:
      labels:
        app: freqtrade
        component: ui
    spec:
      containers:
      - name: ui
        image: ghcr.io/haoweichan/freqtrade/freqtrade-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FT_UI_USERNAME
          valueFrom:
            secretKeyRef:
              name: freqtrade-secrets
              key: ft-ui-username
        - name: FT_UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: freqtrade-secrets
              key: ft-ui-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: freqtrade-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: freqtrade-ui
spec:
  selector:
    app: freqtrade
    component: ui
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer # Expose externally
